name: Publish iOS TestFlight
on:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: production-delivery
  cancel-in-progress: false
jobs:
  publish:
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22.23.3"
          cache: npm
      - run: npm ci
      - run: npm run check
      - name: Inspect production transport configuration
        continue-on-error: true
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID || secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          TARGET_ENVIRONMENT: production
        run: node scripts/require-relay-transport-config.mjs
      - name: Build, sign, and publish iOS through Codemagic
        env:
          CM_API_TOKEN: ${{ secrets.CM_API_TOKEN }}
          CM_APP_ID: ${{ vars.CM_APP_ID }}
          RELEASE_BRANCH: ${{ github.ref_name }}
          EXPECTED_REVISION: ${{ github.sha }}
          RELAY_URL: ${{ vars.RELAY_URL }}
        run: node scripts/codemagic-release.mjs
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: delivery-report
          path: delivery-report.json
          if-no-files-found: ignore
