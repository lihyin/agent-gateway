name: Inspect uploaded Apple build
on:
  workflow_dispatch:
    inputs:
      build_id:
        description: Codemagic iOS build to inspect in Apple without rebuilding
        type: string
        required: true
permissions:
  contents: read
jobs:
  inspect:
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22.23.3"
      - name: Read Apple processing state using the existing integration
        env:
          CM_API_TOKEN: ${{ secrets.CM_API_TOKEN }}
          CM_APP_ID: ${{ vars.CM_APP_ID }}
          CM_BUILD_ID: ${{ inputs.build_id }}
          RELEASE_BRANCH: ${{ github.ref_name }}
          EXPECTED_REVISION: ${{ github.sha }}
        run: node scripts/inspect-apple-build.mjs
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: testflight-inspection
          path: testflight-inspection.json
          if-no-files-found: ignore
