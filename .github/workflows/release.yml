name: Production delivery
on:
  workflow_dispatch:
    inputs:
      deploy_staging:
        description: Also validate and deploy staging before production
        type: boolean
        default: true
        required: true
permissions:
  contents: read
concurrency:
  group: production-delivery
  cancel-in-progress: false
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22.23.3"
          cache: npm
      - run: npm ci
      - run: npm run check
      - run: node scripts/compose-up.mjs
      - run: node scripts/smoke.mjs
      - if: always()
        run: docker compose down
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version-file: mobile/pubspec.yaml
          cache: true
      - working-directory: mobile
        run: flutter pub get && flutter analyze && flutter test
  deploy:
    needs: verify
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22.23.3"
          cache: npm
      - run: npm ci
      - name: Check production configuration
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID || secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          RELAY_URL: ${{ vars.RELAY_URL }}
          STAGING_RELAY_URL: ${{ vars.STAGING_RELAY_URL }}
          CM_API_TOKEN: ${{ secrets.CM_API_TOKEN }}
          CM_APP_ID: ${{ vars.CM_APP_ID }}
          DEPLOY_STAGING: ${{ inputs.deploy_staging }}
        run: node scripts/require-release-config.mjs
      - name: Check relay transport secrets before deployment
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID || secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          WRANGLER_SEND_METRICS: "false"
          DEPLOY_STAGING: ${{ inputs.deploy_staging }}
        run: |
          targets="production"
          if [ "$DEPLOY_STAGING" = true ]; then targets="staging production"; fi
          for target in $targets; do
            npx wrangler secret list --config relay/wrangler.toml --env "$target" > "$RUNNER_TEMP/relay-secret-names.json"
            TARGET_ENVIRONMENT="$target" SECRET_NAMES_FILE="$RUNNER_TEMP/relay-secret-names.json" node --input-type=module <<'JS'
          import { readFileSync } from 'node:fs';
          const names = new Set(JSON.parse(readFileSync(process.env.SECRET_NAMES_FILE, 'utf8')).map(item => item.name));
          const required = ['RELAY_ROUTING_KEY', 'APNS_KEY_ID', 'APNS_TEAM_ID', 'APNS_PRIVATE_KEY', 'APNS_TOPIC', 'APNS_ENVIRONMENT'];
          const missing = required.filter(name => !names.has(name));
          if (missing.length) throw new Error(`${process.env.TARGET_ENVIRONMENT}: missing Worker secrets: ${missing.join(', ')}`);
          console.log(`${process.env.TARGET_ENVIRONMENT}: all required transport secret names are configured.`);
          JS
          done
      - name: Deploy staging and verify release
        if: inputs.deploy_staging
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID || secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          WRANGLER_SEND_METRICS: "false"
          RELAY_URL: ${{ vars.STAGING_RELAY_URL }}
          EXPECTED_REVISION: ${{ github.sha }}
          EXPECTED_ENVIRONMENT: staging
        run: |
          npx wrangler deploy --config relay/wrangler.toml --env staging --var RELEASE_SHA:${GITHUB_SHA} --var "RELAY_ORIGIN:$RELAY_URL"
          node scripts/verify-health.mjs
          node scripts/verify-pairing.mjs
      - name: Deploy production and verify release
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID || secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          WRANGLER_SEND_METRICS: "false"
          RELAY_URL: ${{ vars.RELAY_URL }}
          EXPECTED_REVISION: ${{ github.sha }}
          EXPECTED_ENVIRONMENT: production
        run: |
          npx wrangler deploy --config relay/wrangler.toml --env production --var RELEASE_SHA:${GITHUB_SHA} --var "RELAY_ORIGIN:$RELAY_URL"
          node scripts/verify-health.mjs
          node scripts/verify-pairing.mjs
      - name: Build, sign, and publish iOS through Codemagic
        env:
          STAGING_RELAY_URL: ${{ vars.STAGING_RELAY_URL }}
          CM_API_TOKEN: ${{ secrets.CM_API_TOKEN }}
          CM_APP_ID: ${{ vars.CM_APP_ID }}
          RELEASE_BRANCH: ${{ github.ref_name }}
          EXPECTED_REVISION: ${{ github.sha }}
          RELAY_URL: ${{ vars.RELAY_URL }}
        run: node scripts/codemagic-release.mjs
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: delivery-report
          path: delivery-report.json
          if-no-files-found: ignore
