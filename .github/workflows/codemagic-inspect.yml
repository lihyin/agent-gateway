name: Inspect iOS delivery
on:
  workflow_dispatch:
    inputs:
      build_id:
        description: Accepted Codemagic build ID to inspect without starting another build
        type: string
        required: true
permissions:
  contents: read
jobs:
  inspect:
    runs-on: ubuntu-latest
    environment: production
    env:
      CM_API_TOKEN: ${{ secrets.CM_API_TOKEN }}
      CM_BUILD_ID: ${{ inputs.build_id }}
    steps:
      - uses: actions/setup-node@v4
        with:
          node-version: "22.23.3"
      - name: Read sanitized Codemagic build status
        run: |
          node --input-type=module <<'JS'
          if (!/^[a-f0-9]{24}$/.test(process.env.CM_BUILD_ID)) throw new Error('Invalid build ID');
          if (!process.env.CM_API_TOKEN) throw new Error('Missing CM_API_TOKEN');
          const response = await fetch(`https://codemagic.io/api/v3/builds/${process.env.CM_BUILD_ID}`, {
            headers: { 'x-auth-token': process.env.CM_API_TOKEN, Accept: 'application/json' },
            redirect: 'error', signal: AbortSignal.timeout(30000),
          });
          console.log(`Status endpoint: HTTP ${response.status}; content type ${response.headers.get('content-type')}`);
          let payload;
          try { payload = await response.json(); } catch { throw new Error('Status endpoint did not return JSON'); }
          if (!response.ok) throw new Error(`Codemagic returned HTTP ${response.status}`);
          const build = payload.data;
          if (!build || build.id !== process.env.CM_BUILD_ID) throw new Error('Build response identity mismatch');
          console.log(JSON.stringify({
            id: build.id, appId: build.app_id, workflow: build.workflow?.id,
            revision: build.commit?.hash, status: build.status,
            testflight: build.app_store_connect_status,
            artifacts: build.artifacts?.map(a => a.name),
          }, null, 2));
          JS
